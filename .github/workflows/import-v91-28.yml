name: Import v91.28 handoff

on:
  push:
    branches:
      - transfer/v91-28-clean

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out transfer branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and apply audited handoff
        shell: bash
        run: |
          set -euo pipefail
          base='c495b145202e09e8e5609a5cc91a3c53222d46f3'
          target='fix/audit-v91-28-items-11-20'
          target_old='ad8748633845c4e30c49fdc80360534cead784fd'
          expected_patch_sha='c24c224a5a5c35de06bb9478bc4a0a27fc5b2f451f41417e279a653ee2731309'
          expected_xz_sha='22a94cbede5b0707eb6e6d0ca1f5630a951a77183c4d38a7607b08b7d218f367'

          cat .handoff-v91.28/payload.xz.b64 \
              .handoff-v91.28/payload.part1.b64 \
              .handoff-v91.28/payload.part2.b64 \
              .handoff-v91.28/payload.part3.b64 \
              .handoff-v91.28/payload.part4.b64 > /tmp/payload.b64
          base64 -d /tmp/payload.b64 > /tmp/v91.28-series.xz
          echo "${expected_xz_sha}  /tmp/v91.28-series.xz" | sha256sum -c -
          xz -d -c /tmp/v91.28-series.xz > /tmp/v91.28-series.mbox
          echo "${expected_patch_sha}  /tmp/v91.28-series.mbox" | sha256sum -c -

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "$target" "$base"
          git am --3way --keep-cr /tmp/v91.28-series.mbox

          test "$(git rev-list --count "${base}..HEAD")" = '6'
          grep -F "v91.28 · 2026-09-14" app.js
          grep -F "maister-treker-v67-runtime-67" sw.js
          git diff --check "$base" HEAD

          git push origin "HEAD:refs/heads/${target}" --force-with-lease="refs/heads/${target}:${target_old}"
          echo "Imported HEAD: $(git rev-parse HEAD)"
