# Example Cloudflare Workers configuration for the Maister-Tracker MCP server.
# Copy to wrangler.toml and fill in your values. NEVER commit wrangler.toml
# with real secrets — use `wrangler secret put` instead.

name = "maister-tracker-mcp"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Cron Trigger: keep the KV snapshot warm (~every 5 minutes). Optional — the
# /mcp and /ask paths work without it (cold cache misses fall back to GAS).
# Free plan allows up to 5 cron triggers per account; KV writes at this rate
# (288/day) fit well inside the free 1,000 writes/day quota.
crons = ["*/5 * * * *"]

# KV namespace used as the READ snapshot cache (stores ONLY the redacted
# projection, ~5 min freshness + stale-while-revalidate). Create once and
# paste the returned id:
#   npx wrangler kv namespace create MT_SNAPSHOT_KV
# The binding NAME must stay MT_SNAPSHOT_KV. If you remove this block, the
# server keeps working with a transparent no-cache passthrough.
[[kv_namespaces]]
binding = "MT_SNAPSHOT_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Non-secret tunables (safe to keep as plain vars).
[vars]
MCP_RATE_LIMIT_PER_MIN = "120"
MCP_LIST_CACHE_TTL_MS = "15000"
# 20000 ms: the cold GAS `list` takes ~6-19 s in production (8 s caused
# MCP_TOOL_ERROR: NETWORK aborts on real calls).
MCP_GAS_TIMEOUT_MS = "20000"

# --- stage A: KV snapshot cache knobs (defaults shown) ---
#MCP_SNAPSHOT_TTL_MS = "300000"     # fresh window, 5 min
#MCP_SNAPSHOT_STALE_MS = "86400000" # max age still served when GAS fails

# --- stage D: AI /ask (optional; absence never disables /mcp) ---
#DEEPSEEK_MODEL = "deepseek-flash"        # default DeepSeek model (non-thinking)
#ASK_MODEL = "openai/gpt-oss-120b"        # default Groq model
#ASK_BEARER_TOKENS = "pwa:mt_...:read"    # optional separate token for the PWA;
                                          # when absent, /ask accepts the MCP tokens
# DEEPSEEK_API_KEY — ONLY via:  npx wrangler secret put DEEPSEEK_API_KEY
# GROQ_API_KEY — ONLY via:      npx wrangler secret put GROQ_API_KEY
# (never in this file, never in git, never in the frontend).

# Secrets — set each one with:  npx wrangler secret put <NAME>
#
# 1) GAS_SYNC_URL
#    The Google Apps Script Web App deployment URL (the same /exec endpoint the
#    PWA uses as settings.scriptUrl for ticket sync).
#
# 2) GAS_SYNC_HMAC_SECRET
#    The sync HMAC secret (>= 32 chars). MUST be the same secret the PWA stores
#    encrypted in its settings vault — the GAS server validates signatures
#    against exactly one shared secret.
#
# 3) MCP_BEARER_TOKENS
#    Scoped bearer tokens for MCP clients. Format (entries separated by ";" or
#    newlines, fields by ":"):
#      name:token:scope
#    Example:
#      test-cli:mt_test_cli_0123456789abcdef0123456789abcdef:read
#    Requirements: name [a-z0-9_-]{1,32}; token [A-Za-z0-9_-]{32,128};
#    scope must be "read" in this READ-ONLY stage. Tokens are compared in
#    constant time and never logged.
#
# OAuth 2.1 (required by some cloud clients, e.g. ChatGPT custom connectors)
# is intentionally NOT implemented in this stage; the auth layer is a single
# pluggable function (authenticate) so an OAuth resource-server layer can be
# added in front of the same tool handlers without touching them.
#
# No D1/KV/R2 bindings are used in this stage: the server stores NO ticket
# data — every read goes through to the existing GAS/Sheets contract.
