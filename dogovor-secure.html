</style></head><body><div class="wrap"><div class="card"><h1>🔐 Дані абонента</h1><div class="muted">Legacy v1 viewer: дані читаються лише з URL fragment і не передаються серверу.</div><div id="content" class="hidden"><div class="row"><div class="label">Адреса</div><div class="value" id="addr">—</div></div><div class="row"><div class="label">Логін</div><div class="value secret" id="login">—</div></div><div class="row"><div class="label">Пароль</div><div class="value secret" id="pass">—</div></div><div class="row"><div class="label">Номер договору</div><div class="value" id="number">—</div></div><div class="row"><div class="label">Дата</div><div class="value" id="date">—</div></div><div class="warn">Не пересилайте скриншот стороннім: він містить облікові дані.</div></div><div id="error" class="bad hidden">Не вдалося прочитати захищені дані з QR-коду.</div></div></div><script src="dogovor-secure.js"></script></body></html>
